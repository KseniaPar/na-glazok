[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "na-glazok"
version = "1.0.0"
description = "На Глазок — веб-чат КБЖУ с Gateway и Security Step"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "tiktoken>=0.8.0",
  "aiohttp>=3.9.0",
  "aiogram>=3.4,<4",
]

[project.scripts]
na-glazok = "na_glazok.__main__:main"

[tool.setuptools.packages.find]
include = ["na_glazok*"]

[tool.setuptools.package-data]
na_glazok = ["web/static/*"]
